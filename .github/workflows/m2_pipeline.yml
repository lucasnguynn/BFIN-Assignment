name: M2 Revised Mandate - Offline Rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m2-revised:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify original 2022 decision code (no live retrieval)
        run: python -m unittest discover -s portfolio_construction/tests -v
      - name: Rebuild M2 revised scenarios from Member 1 committed outcomes
        run: python portfolio_construction/revised_mandate/m1_integration.py
      - name: Build source-traceable M2 to M3 factor-input handoff
        run: python portfolio_construction/revised_mandate/m3_handoff.py
      - name: Upload only derived scenario results and source hashes
        uses: actions/upload-artifact@v4
        with:
          name: M2-revised-offline-${{ github.run_number }}
          path: |
            portfolio_construction/revised_mandate/outputs/
            portfolio_construction/revised_mandate/m3_handoff/
          if-no-files-found: error
          retention-days: 30
