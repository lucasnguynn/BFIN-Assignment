name: CI (unit tests and QA gates)
on:
  push:
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit tests - portfolio construction
        run: python -m unittest discover -s portfolio_construction/tests -v
      - name: Unit tests - factor analysis
        run: python -m unittest discover -s factor_analysis/tests -v
      - name: Unit tests - quality assurance
        run: python -m unittest discover -s quality_assurance/tests -v
      - name: QA gates (offline, all required saved sources must be present)
        run: python run_pipeline.py
