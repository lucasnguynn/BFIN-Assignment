name: Fetch CC0 illustrative slide images (one-time)
on:
  push:
    branches: ["finish/visual-provenance-20261028"]
    paths: [".github/workflows/fetch-visual-assets.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install Pillow==11.3.0
      - name: Download and archive CC0 illustration photos once
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          from PIL import Image
          path=Path("Final Submission/assets")
          path.mkdir(parents=True,exist_ok=True)
          photos=[
            ("Campus.jpg","Building_on_campus_at_Cornell_University.jpg",
             "https://commons.wikimedia.org/wiki/File:Building_on_campus_at_Cornell_University.jpg",
             "Tomwsulcer"),
            ("Study.jpg","Students_in_Seminar_Library.jpg",
             "https://commons.wikimedia.org/wiki/File:Students_in_Seminar_Library.jpg",
             "Morshedhasan12"),
          ]
          records=[]
          for filename,original,source,author in photos:
            url="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+original
            req=urllib.request.Request(url,headers={"User-Agent":"Kappa BFIN academic visual source archive/1.0 (respectful image reuse)"})
            with urllib.request.urlopen(req,timeout=45) as response:
              raw=response.read()
            if len(raw)<10000 or not raw.startswith(b"\xff\xd8\xff"):
              raise ValueError("Not a JPEG: "+original)
            tmp=path/filename
            tmp.write_bytes(raw)
            with Image.open(tmp) as im:
              im.verify()
            with Image.open(tmp) as im:
              im=im.convert("RGB")
              im.thumbnail((1600,1100))
              im.save(tmp,format="JPEG",quality=82,subsampling=0,optimize=True)
            digest=hashlib.sha256(tmp.read_bytes()).hexdigest()
            records.append(dict(file="assets/"+filename,original=original,url=source,author=author,
                                license="Creative Commons CC0 1.0 Public Domain Dedication",
                                sha256=digest,illustration_only=True))
          (path/"Sources.json").write_text(json.dumps(records,indent=2)+"\n",encoding="utf-8")
          print("CC0 ASSETS",[(r["file"],r["sha256"]) for r in records])
          PY
      - name: Commit visual source assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Final Submission/assets"
          git commit -m "Archive license-audited CC0 campus and student photos"
          git push origin "HEAD:$GITHUB_REF_NAME"
