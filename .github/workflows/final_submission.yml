name: Build Final Submission
on:
  push:
    branches: [main, final/committee-submission-20261027, final/visual-presentation-20261027, final/visual-presentation-fast-20261027]
    paths:
      - "Final Submission/Committee Memo.md"
      - "Final Submission/build_final.py"
      - "Final Submission/visual_slides.py"
      - "Final Submission/fallback_pdf.py"
      - "portfolio_construction/post_freeze_evaluation/revised_fund_monitor.py"
      - ".github/workflows/final_submission.yml"
      - "portfolio_construction/Portfolio Final/**"
      - "README.md"
      - "factor_analysis/docs/contribution_and_critique_M3.md"
      - "portfolio_construction/docs/contribution_and_critique_portfolio_construction.md"
      - "portfolio_construction/post_freeze_evaluation/README.md"
      - "quality_assurance/cross_workstream_review.md"
  pull_request:
    paths:
      - "Final Submission/**"
      - "portfolio_construction/**"
      - "quality_assurance/**"
      - "README.md"
      - ".github/workflows/final_submission.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install offline dependencies
        run: pip install -r requirements.txt
      - name: Check portfolio, factor and QA tests
        run: |
          python -m unittest discover -s portfolio_construction/tests
          python -m unittest discover -s factor_analysis/tests
          python -m unittest discover -s quality_assurance/tests
      - name: Prepare saved Yahoo inputs without downloading artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/observed/observed_yahoo_data" "$RUNNER_TEMP/observed/observed_provisional_results"
          cp "portfolio_construction/Portfolio Final/Sources/Yahoo Raw.zip" "$RUNNER_TEMP/observed/observed_yahoo_data/yfinance_evaluation_RAW.zip"
          cp "portfolio_construction/Portfolio Final/Sources/Observed Prices.csv" "$RUNNER_TEMP/observed/observed_yahoo_data/daily_adjusted_prices_2023_2025.csv"
          cp "portfolio_construction/Portfolio Final/Sources/Market Source.json" "$RUNNER_TEMP/observed/observed_yahoo_data/evaluation_source_record.json"
          cp "portfolio_construction/Portfolio Final/Sources/Observed Monthly.csv" "$RUNNER_TEMP/observed/observed_provisional_results/PROVISIONAL observed 2023-2025 monthly growth VTI.csv"
          cp "portfolio_construction/Portfolio Final/Sources/Observed Summary.json" "$RUNNER_TEMP/observed/observed_provisional_results/PROVISIONAL observed performance summary.json"
      - name: Refresh revised outputs and reader files from saved repository data
        run: |
          python portfolio_construction/revised_mandate/m1_integration.py --out portfolio_construction/revised_mandate/outputs
          python portfolio_construction/build_portfolio_files.py --observed "$RUNNER_TEMP/observed"
      - name: Rebuild modeled revised fund monitor
        run: |
          python portfolio_construction/post_freeze_evaluation/revised_fund_monitor.py --growth-monthly "portfolio_construction/Portfolio Final/Sources/Observed Monthly.csv" --out "portfolio_construction/outputs/revised_fund_monitor.csv" --policy principal
      - name: Validate archived JNJ prices and no-tender sensitivity
        run: python portfolio_construction/post_freeze_evaluation/jnj_vendor_check.py
      - name: Build group documents
        run: python "Final Submission/build_final.py"
      - name: Verify final output formats and archived source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import zipfile
          from pypdf import PdfReader
          from pptx import Presentation
          from docx import Document
          d=Path("Final Submission")
          names=["Committee Memo.pdf","Committee Memo.docx","Presentation.pdf","Presentation.pptx","Decision Record.pdf","Analysis.zip","Read Me.txt","Final Submission.zip"]
          for name in names:assert (d/name).stat().st_size>1000,name
          assert len(PdfReader(d/"Committee Memo.pdf").pages)<=8
          assert len(PdfReader(d/"Presentation.pdf").pages)==17
          assert len(Presentation(d/"Presentation.pptx").slides)==17
          assert len(Document(d/"Committee Memo.docx").paragraphs)>15
          for name in ["Analysis.zip","Final Submission.zip"]:
              with zipfile.ZipFile(d/name) as z:assert z.testzip() is None
          with zipfile.ZipFile(d/"Analysis.zip") as z:
              assert "portfolio_construction/outputs/revised_fund_monitor.csv" in z.namelist()
              assert "portfolio_construction/Portfolio Final/Sources/Yahoo Raw.zip" in z.namelist()
          ppt=Presentation(d/"Presentation.pptx")
          count=sum(sh.has_chart for slide in ppt.slides for sh in slide.shapes)
          assert count>=11,count
          text=" ".join(p.text for p in Document(d/"Committee Memo.docx").paragraphs)
          assert "The trustees have not approved these precise thresholds" in text
          assert "original policy's USD 6.229 million growth allocation" in text
          slide_text=" ".join(sh.text for slide in ppt.slides for sh in slide.shapes if sh.has_text_frame)
          assert "Our proposed review rules still require trustee agreement." in slide_text
          assert "Original $6.229m equity base" in slide_text
          assert "Single Index" in slide_text
          assert "Gain: +0.000000013" in slide_text
          qa=json.loads(Path("quality_assurance/qa_report.json").read_text())
          assert qa["counts"]["FAIL"]==0 and qa["counts"]["BLOCKED"]==0
          # Structural review of editable workbooks without relying on workbook caches.
          import xml.etree.ElementTree as ET
          for workbook in (
              Path("portfolio_construction/Portfolio Final/Results.xlsx"),
              Path("bond_funding/Kappa_Bond_Funding_Model_Revised.xlsx"),
          ):
              with zipfile.ZipFile(workbook) as book:
                  wb=ET.fromstring(book.read("xl/workbook.xml"))
                  sheets=wb.findall(".//{http://schemas.openxmlformats.org/spreadsheetml/2006/main}sheet")
                  cells=0
                  formula_count=0
                  for name in book.namelist():
                      if name.startswith("xl/worksheets/sheet") and name.endswith(".xml"):
                          xml=ET.fromstring(book.read(name))
                          ns="{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
                          cells+=len(xml.findall(".//"+ns+"c"))
                          formula_count+=len(xml.findall(".//"+ns+"f"))
                  assert len(sheets)>=3 and cells>100,(workbook,len(sheets),cells)
                  print("WORKBOOK AUDIT",workbook.name,"sheets",len(sheets),"cells",cells,"formulas",formula_count)
          # Check source slide text survives the independent PDF renderer.
          rendered=PdfReader(d/"Presentation.pdf")
          for page,expected in (
              (2,"Our recommendation"),
              (9,"More expected return means more estimated risk"),
              (11,"Re-optimization delivers a tiny modeled gain"),
              (14,"The selected shares grew, but VTI did better"),
              (15,"Selected shares underperformed the VTI benchmark"),
              (16,"Implementation requires monitoring and discipline"),
          ):
              page_text=rendered.pages[page-1].extract_text() or ""
              assert expected in page_text,(page,expected,page_text[:240])
          picture_count=sum(int(sh.shape_type==13) for slide in ppt.slides for sh in slide.shapes)
          print("PPTX MEDIA AUDIT",picture_count,"picture shapes; visual photo-template parity must be checked separately")
          import hashlib
          with zipfile.ZipFile(d/"Analysis.zip") as z:
              packaged=set(z.namelist())
              for file in ("Final Submission/build_final.py",
                           "Final Submission/Committee Memo.md",
                           "Final Submission/visual_slides.py",
                           "Final Submission/fallback_pdf.py",
                           "quality_assurance/Group Review and AI Use.md",
                           "portfolio_construction/post_freeze_evaluation/jnj_vendor_check.py",
                           "portfolio_construction/evidence/decision_weights_confirmed.csv",
                           "portfolio_construction/Portfolio Final/Sources/Yahoo Raw.zip"):
                  assert file in packaged,file
          with zipfile.ZipFile(d/"Final Submission.zip") as z:
              members=[name for name in names if name!="Final Submission.zip"]
              assert set(z.namelist())==set(members+["Checksums.txt"])
              checks=z.read("Checksums.txt").decode("utf-8").splitlines()
              assert len(checks)==len(members)
              for row in checks:
                  hash_hex,name=row.split("  ",1)
                  assert hashlib.sha256(z.read(name)).hexdigest()==hash_hex,name
                  assert z.read(name)==(d/name).read_bytes(),name
          print("PASS: memo, 17 slides, "+str(count)+" editable charts, checksum and source-complete ZIP")
          PY
      - name: Rebuild from a freshly extracted Analysis.zip without network
        run: |
          scratch="$(mktemp -d)"
          unzip -q "Final Submission/Analysis.zip" -d "$scratch"
          cd "$scratch"
          python "Final Submission/build_final.py" --rebuild-offline
      - name: Commit prepared submission on this branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "Final Submission" "portfolio_construction/revised_mandate/outputs" "quality_assurance/qa_report.json"
          if ! git diff --cached --quiet; then
            git commit -m "Publish committee memo and final submission files"
            # Only publish a fast-forward. If main moves, reject rather than rebasing a dirty generated-worktree.
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
