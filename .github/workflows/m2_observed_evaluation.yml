name: M2 Observed Yahoo Data Acquisition - Conditional Email Freeze
# Re-trigger after the provisional evaluator was added; source snapshots are timestamped.
on:
  push:
    branches:
      - m2/revised-mandate-integration-20261024
    paths:
      - .github/workflows/m2_observed_evaluation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out submitted-case repository policy and acquisition scripts
        uses: actions/checkout@v4
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yfinance and evaluation prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portfolio_construction/requirements_post_freeze.txt
          python -m pip freeze > evaluation_package_versions.txt
      - name: Show independent submission-email evidence gate
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('portfolio_construction')
          evidence=json.loads((root/'post_freeze_evaluation/evidence/Email Submission Receipt - Conditional.json').read_text())
          assert evidence['evidence_channel']=='UNIVERSITY_EMAIL_SUBMISSION_CC_COPY'
          assert evidence['instructor_or_lms_acceptance_verified'] is False
          assert hashlib.sha256((root/'evidence/decision_weights_confirmed.csv').read_bytes()).hexdigest()==evidence['frozen_weights_sha256']
          assert hashlib.sha256((root/'docs/Kappa Foundation- Initial Decision.pdf').read_bytes()).hexdigest()==evidence['submitted_pdf_sha256']
          print('DOCUMENTED EMAIL SENT 2026-10-22 15:44:53 HCMC. Moodle acceptance NOT VERIFIED.')
          PY
      - name: Retrieve original 2023-2025 Yahoo responses after email submission
        run: |
          mkdir -p observed_yahoo_data
          python portfolio_construction/post_freeze_evaluation/retrieve_evaluation_yahoo.py \
            --root portfolio_construction \
            --receipt "portfolio_construction/post_freeze_evaluation/evidence/Email Submission Receipt - Conditional.json" \
            --out-dir observed_yahoo_data 2>&1 | tee observed_yahoo_retrieval.log
      - name: Generate explicitly provisional observed-data evaluation without certifying the JNJ reviewer gate
        run: |
          python portfolio_construction/post_freeze_evaluation/observed_provisional_evaluation.py \
            --root portfolio_construction \
            --receipt "portfolio_construction/post_freeze_evaluation/evidence/Email Submission Receipt - Conditional.json" \
            --prices observed_yahoo_data/daily_adjusted_prices_2023_2025.csv \
            --source-record observed_yahoo_data/evaluation_source_record.json \
            --raw-archive observed_yahoo_data/yfinance_evaluation_RAW.zip \
            --out-dir observed_provisional_results
      - name: Upload observed market files, flagged preliminary evaluation and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M2-Observed-Yahoo-Conditional-${{ github.run_number }}
          path: |
            observed_yahoo_data/
            observed_provisional_results/
            observed_yahoo_retrieval.log
            evaluation_package_versions.txt
          if-no-files-found: warn
          retention-days: 45
